[project]
name = "robolab"
version = "0.3.2+verified.1"
description = "RoboLab Verified: NVIDIA RoboLab v0.3.2 with a verified evaluation harness"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "Apache-2.0"}
authors = [{name = "Xuning Yang"}]
maintainers = [{name = "Manda Robotics"}]

dependencies = [
    # Core
    # The supported simulator stack is selected with `uv sync --extra isaac60`.
    # Isaac Lab's isaacsim extra supplies the matching Isaac Sim 6.0.1 stack.
    "torch",
    "numpy",
    "gymnasium",
    # Remote inference
    "openai",
    "requests",
    "json_numpy",
    "pyzmq",
    "msgpack",
    "msgpack-numpy",
    "websockets",
    # Computer vision and image processing
    "opencv-python",
    "Pillow",
    "imageio",
    # Scientific computing
    "scipy",
    "matplotlib",
    # Data handling
    "h5py",
    "PyYAML",
    "pandas",
    # Misc
    "tqdm",
    "tyro",
    "python-dotenv",
    "setuptools<81",
    # Dashboard (robolab-dashboard CLI); kept in the default install since
    # the runtime footprint is small and most users want it available.
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
]

[project.urls]
Homepage = "https://github.com/Manda-Robotics/RoboLab-Verified"
Upstream = "https://github.com/NVlabs/RoboLab"
Changes = "https://github.com/Manda-Robotics/RoboLab-Verified/blob/main/docs/verified/changes.md"

[project.optional-dependencies]
# Isaac Sim 6.0.1 / Isaac Lab 3.0 beta (Python 3.12).
isaac60 = [
    # Isaac Lab 3's published wheel bundles isaaclab_physx, isaaclab_tasks,
    # isaaclab_visualizers, and the other Lab extensions. Its `isaacsim` extra
    # selects the matching Isaac Sim 6.0.1 package stack.
    "isaaclab[isaacsim]==3.0.0b2.post1; python_version >= '3.12'",
]
analysis = ["sbi"]
# httpx supports dashboard route tests; usd-core supports offline asset checks.
test = ["pytest", "usd-core", "httpx"]
all = ["sbi", "pytest"]

[project.scripts]
robolab-dashboard = "dashboard.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["robolab", "robolab.*", "policies", "policies.*", "dashboard", "dashboard.*"]
exclude = ["policies.ai_native.dev", "policies.ai_native.dev.*", "policies.ai_native.*.dev", "policies.ai_native.*.dev.*"]

[tool.setuptools.package-data]
dashboard = ["templates/*.html", "static/*"]

# -- uv configuration --

[tool.uv]
prerelease = "allow"
index-strategy = "unsafe-best-match"
# warp-lang 1.13.0.dev20260418 on pypi.nvidia.com only published the macOS
# wheel — no Linux build — so any resolver pass that picked it would break
# `uv sync` on Linux. Exclude that specific version.
constraint-dependencies = ["warp-lang != 1.13.0.dev20260418"]

[tool.uv.extra-build-dependencies]
# flatdict 4.0.1 ships sdist-only and its legacy setup.py needs an older
# setuptools plus `wheel` to build. Building in an isolated PEP 517 env
# (i.e. NOT in `no-build-isolation-package`) lets these deps apply
# deterministically regardless of what's in the project venv.
flatdict = ["setuptools<81", "wheel"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[tool.uv.sources]
# The CUDA index has no macOS wheels; on other platforms uv falls back to PyPI, which is
# enough for the offline suite (no simulator, CPU torch).
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests", "dashboard/tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["robolab", "policies"]
known-third-party = ["isaaclab", "isaaclab_assets", "isaaclab_mimic", "isaaclab_physx", "isaaclab_rl", "isaaclab_tasks", "isaaclab_visualizers"]
