name: static audits

# Read-only task and scene checks; no Isaac Sim or GPU required.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy h5py usd-core

      - name: task-definition audit
        # exits non-zero on a CONFLICT (a definition that cannot score what it says);
        # notes (landmarks a ladder never names, duplicate test classes) are printed only.
        # The spawn-state check needs recorded runs that are not in CI, so candidates
        # that need it are listed as NOT asserted rather than reported.
        run: python scripts/audit_task_definitions.py

      - name: scene intersection report
        # differential by design: the rule is "no NEW overlapping pair", so this is
        # informational in CI and compared by hand on a scene change.
        run: python scripts/check_scene_intersections.py || true
